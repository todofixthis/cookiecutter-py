# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI

on:
  push: ~

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --group ci
      - name: Run tests
        run: uv run pytest

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --group ci
      - name: Type checking
        run: uv run mypy test scripts .autohooks

  # Bakes a real project from this template with copier and validates the
  # result the same way a maintainer of a generated project would: lint,
  # type-check, test, and build its docs.
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          # Note: Use quotes to avoid float cast - especially important if the
          # version number ends with 0!
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Bakes with the copier version uv.lock pins, which Renovate maintains.
      # UV_PYTHON runs it under the matrix leg's interpreter; the
      # python_version answer keeps its default, so every leg bakes the
      # project the template ships.
      - name: Install the template's dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --group ci
      - name: Bake a project with default answers
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run copier copy --defaults --vcs-ref=HEAD --data copyright_year=2026 --data project_short_description=x . /tmp/baked/my-python-project
      # UV_PYTHON runs the generated project's environment, and so every step
      # below, under the matrix leg's interpreter.
      - name: Install the generated project's dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --group ci
        working-directory: /tmp/baked/my-python-project
      - name: Lint the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run ruff check
        working-directory: /tmp/baked/my-python-project
      - name: Type-check the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run mypy src test
        working-directory: /tmp/baked/my-python-project
      - name: Test the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest
        working-directory: /tmp/baked/my-python-project
      - name: Build the generated project's docs
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          mkdir -p _static
          uv run make html
        working-directory: /tmp/baked/my-python-project/docs

  # The phx plugin's hooks check ADRs in Claude Code sessions but never block,
  # so this is the only check a commit made elsewhere meets (ADR 009 forbids a
  # repo-local copy of the tool). Renovate bumps the pinned release here, in
  # AGENTS.md and in the template together; keep the trailing version comment
  # it matches on.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check ADRs
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@0725567cec6bab6a227c2a3d569e64c226c33a4e#subdirectory=skills/writing-adrs' phx-adr check # 8.1.0

  # The single required status check. Depending on every job here collapses
  # their results into one, so branch protection requires only `gate`. A
  # skipped job fails it, so a job silently skipped cannot pass unnoticed.
  gate:
    needs: [adrs, generate, test, type-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
