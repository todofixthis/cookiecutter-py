# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI

on:
  push: ~

permissions:
  contents: read

# Every uv command here leaves out the default `dev` group, whose tooling
# (autohooks → pontos → lxml) can lack wheels for a new Python. A flag on
# `uv sync` alone isn't enough: each `uv run` would install `dev` again.
env:
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The generate matrix's newest. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group ci
      - name: Run tests
        run: uv run pytest

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The generate matrix's newest. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group ci
      - name: Type checking
        run: uv run mypy test scripts .autohooks

  # Bakes a real project from this template with copier and validates the
  # result the same way a maintainer of a generated project would: lint,
  # type-check, test, and build its docs.
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          # Note: Use quotes to avoid float cast - especially important if the
          # version number ends with 0!
          - "3.12"
          - "3.13"
          - "3.14"
        docs-site: [true]
        # A project with no docs site of its own differs only in files, not in
        # Python support, so one leg covers it (ADR 016).
        include:
          - python-version: "3.14"
            docs-site: false
            # A project without its own site names the site documenting it.
            slug-data: --data readthedocs_slug=parent-project

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Bakes with the copier version uv.lock pins, which Renovate maintains.
      # UV_PYTHON runs it under the matrix leg's interpreter; the
      # python_version answer keeps its default, so every leg bakes the
      # project the template ships.
      - name: Install the template's dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --group ci
      - name: Bake a project with default answers, bar its docs site
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run copier copy --defaults --vcs-ref=HEAD --data copyright_year=2026 --data project_short_description=x --data docs_site=${{ matrix.docs-site }} ${{ matrix.slug-data }} . /tmp/baked/my-python-project
      # UV_PYTHON runs the generated project's environment, and so every step
      # below, under the matrix leg's interpreter.
      - name: Install the generated project's dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --group ci
        working-directory: /tmp/baked/my-python-project
      - name: Lint the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run ruff check
        working-directory: /tmp/baked/my-python-project
      - name: Check the generated project's formatting
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run black --check .
        working-directory: /tmp/baked/my-python-project
      - name: Type-check the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run mypy src test
        working-directory: /tmp/baked/my-python-project
      - name: Test the generated project
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run pytest
        working-directory: /tmp/baked/my-python-project
      - name: Build the generated project's docs
        if: matrix.docs-site
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        # -W matches the generated project's own docs job (ADR 020).
        run: |
          mkdir -p _static
          uv run make html SPHINXOPTS=-W
        working-directory: /tmp/baked/my-python-project/docs
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # The bake tests read infra/github as text; this has Terraform parse it,
      # fetching the module the template pins (ADR 025).
      - name: Validate the generated project's GitHub settings
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/github init -input=false -backend=false
          terraform -chdir=infra/github validate
        working-directory: /tmp/baked/my-python-project

  # The phx plugin's hooks check ADRs in Claude Code sessions but never block,
  # so this is the only check a commit made elsewhere meets (ADR 018).
  # ADR 019 rules out a repo-local copy of the tool, or a pre-commit hook
  # running ADR tooling. Renovate bumps the pinned release here, in AGENTS.md
  # and in the template together; keep the trailing version comment it
  # matches on.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check ADRs
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@86f320fb6af2894dafd30cbd1e0dc1cbdb5c4575#subdirectory=skills/writing-adrs' phx-adr check # 9.2.0

  # Renovate's own validator checks this repo's config and a baked project's
  # (ADR 026), each from the directory holding it, so it checks the file a
  # project receives rather than the template's source.
  # With no renovate.json in its working directory it passes having checked
  # nothing, so each step checks the file exists first. Its npm `deprecated`
  # warnings come from Renovate's own dependencies. Keep install scripts on:
  # without re2's, Renovate falls back to JavaScript regexes and accepts
  # patterns the hosted app rejects.
  renovate:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.257.5

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the template's dependencies
        run: uv sync --group ci
      - name: Bake a project with default answers
        run: uv run copier copy --defaults --vcs-ref=HEAD --data copyright_year=2026 --data project_short_description=x . /tmp/baked/my-python-project
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Validate this repo's Renovate config
        run: |
          test -f renovate.json
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
      - name: Validate the generated project's Renovate config
        run: |
          test -f renovate.json
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
        working-directory: /tmp/baked/my-python-project

  # The required status check on `develop` and `main`. Depending on every job
  # here collapses their results into one, so no ruleset lists them. `main`
  # also requires the Release workflow's `release-check` (ADR 018). A
  # skipped job fails it, so a job silently skipped cannot pass unnoticed.
  gate:
    needs: [adrs, generate, renovate, test, type-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any check did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
