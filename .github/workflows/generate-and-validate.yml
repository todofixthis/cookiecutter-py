# Bakes a real project from this template with copier and validates the
# result the same way a maintainer of a generated project would: lint,
# type-check, test, and build its docs.
name: Generate and Validate

on:
  push: ~

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          # Note: Use quotes to avoid float cast - especially important if the
          # version number ends with 0!
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bake a project with default answers
        # --python runs copier under the matrix leg's interpreter, and the
        # python_version answer bakes a project whose newest supported Python
        # is that leg's, so each leg validates a different floor.
        run: uvx --python "${{ matrix.python-version }}" "copier>=9,<10" copy --defaults --vcs-ref=HEAD --data copyright_year=2026 --data project_short_description=x --data python_version="${{ matrix.python-version }}" . /tmp/baked/my-python-project
      - name: Install the generated project's dependencies
        run: uv sync --group ci
        working-directory: /tmp/baked/my-python-project
      - name: Lint the generated project
        run: uv run ruff check
        working-directory: /tmp/baked/my-python-project
      - name: Type-check the generated project
        run: uv run mypy src test
        working-directory: /tmp/baked/my-python-project
      - name: Test the generated project
        run: uv run pytest
        working-directory: /tmp/baked/my-python-project
      - name: Build the generated project's docs
        run: |
          mkdir -p _static
          uv run make html
        working-directory: /tmp/baked/my-python-project/docs
